<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포니 익스프레스 우편 배달 게임</title>
    <style>
        body {
            background-color: #2c1d11;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        h1 {
            color: #f39c12;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #score-board {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #8e44ad;
            background: linear-gradient(to bottom, #d35400, #f39c12, #e67e22);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 12px;
            font-size: 14px;
            color: #ecf0f1;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>🐎 포니 익스프레스 우편 배달</h1>
    <div id="score-board">배달한 편지: <span id="score">0</span>통</div>
    
    <canvas id="gameCanvas" width="600" height="350"></canvas>
    
    <div class="instructions">
        위·아래 방향키(↑, ↓) 또는 W, S키로 말을 조종하세요!<br>
        달려오면서 편지(✉️)를 모으고 선인장(🌵)과 바위를 피하세요.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 플레이어 (말을 탄 배달부) 설정
        let rider = {
            x: 80,
            y: canvas.height / 2,
            width: 40,
            height: 35,
            speed: 5
        };

        let keys = {};
        let letters = [];
        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        let gameFrame = 0;

        // 키 입력 처리
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (["ArrowUp", "ArrowDown", "w", "s", "W", "S"].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function spawnItems() {
            // 일정 주기로 편지 생성
            if (gameFrame % 90 === 0) {
                letters.push({
                    x: canvas.width,
                    y: Math.random() * (canvas.height - 80) + 40,
                    width: 25,
                    height: 20,
                    speed: 4
                });
            }

            // 일정 주기로 장애물(선인장/바위) 생성
            if (gameFrame % 110 === 0) {
                obstacles.push({
                    x: canvas.width,
                    y: Math.random() * (canvas.height - 90) + 40,
                    width: 30,
                    height: 30,
                    speed: 4
                });
            }
        }

        function update() {
            if (isGameOver) return;

            gameFrame++;

            // 플레이어 이동 (위, 아래)
            if ((keys["ArrowUp"] || keys["w"] || keys["W"]) && rider.y > 20) {
                rider.y -= rider.speed;
            }
            if ((keys["ArrowDown"] || keys["s"] || keys["S"]) && rider.y < canvas.height - rider.height - 20) {
                rider.y += rider.speed;
            }

            spawnItems();

            // 편지 이동 및 충돌 체크
            for (let i = letters.length - 1; i >= 0; i--) {
                let l = letters[i];
                l.x -= l.speed;

                // 플레이어와 편지 충돌 체크 (먹기)
                if (
                    rider.x < l.x + l.width &&
                    rider.x + rider.width > l.x &&
                    rider.y < l.y + l.height &&
                    rider.y + rider.height > l.y
                ) {
                    score += 1;
                    document.getElementById("score").innerText = score;
                    letters.splice(i, 1);
                    continue;
                }

                // 화면 밖으로 나가면 삭제
                if (l.x + l.width < 0) {
                    letters.splice(i, 1);
                }
            }

            // 장애물 이동 및 충돌 체크
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= o.speed;

                // 플레이어와 장애물 충돌 체크 (게임 오버)
                if (
                    rider.x < o.x + o.width - 5 &&
                    rider.x + rider.width - 5 > o.x &&
                    rider.y < o.y + o.height - 5 &&
                    rider.y + rider.height - 5 > o.y
                ) {
                    isGameOver = true;
                }

                // 화면 밖으로 나가면 삭제
                if (o.x + o.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 서부 개척지 지평선/땅 느낌의 배경 선
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 25);
            ctx.lineTo(canvas.width, canvas.height - 25);
            ctx.stroke();

            // 편지(아이템) 그리기
            ctx.font = "22px Arial";
            letters.forEach(l => {
                ctx.fillText("✉️", l.x, l.y + 18);
            });

            // 장애물(선인장) 그리기
            obstacles.forEach(o => {
                ctx.fillText("🌵", o.x, o.y + 22);
            });

            // 플레이어(말을 탄 배달부) 그리기
            ctx.fillText("🐎", rider.x, rider.y + 25);

            // 게임 오버 화면
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px Arial";
                ctx.textAlign = "center";
                ctx.fillText("우편 배달 실패! 😢", canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "15px Arial";
                ctx.fillStyle = "#f39c12";
                ctx.fillText(`총 배달한 편지: ${score}통`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.font = "13px Arial";
                ctx.fillStyle = "#bdc3c7";
                ctx.fillText("새로고침(F5)을 누르면 다시 도전할 수 있어요!", canvas.width / 2, canvas.height / 2 + 45);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
