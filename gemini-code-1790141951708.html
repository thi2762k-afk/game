<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>알록달록 퍼즐 버블 게임</title>
    <style>
        body {
            background-color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        h1 {
            margin-bottom: 5px;
            color: #ffcc00;
        }
        #score-board {
            font-size: 18px;
            margin-bottom: 10px;
        }
        canvas {
            border: 4px solid #444;
            background-color: #1a1a1a;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 8px;
            cursor: crosshair;
        }
        .instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🫧 퍼즐 버블</h1>
    <div id="score-board">점수: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div class="instructions">
        마우스로 방향을 겨누고 **클릭**하면 방울이 발사됩니다!<br>
        같은 색 방울 3개 이상을 맞추면 터져요.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const bubbleRadius = 18;
        const cols = 10;
        const rows = 9;
        const colors = ["#ff4d4d", "#4da6ff", "#ffff4d", "#4dff4d", "#ff4dda"];

        let board = [];
        let score = 0;
        let shooter = { x: canvas.width / 2, y: canvas.height - 30, color: randomColor() };
        let bullet = null;
        let isMoving = false;

        function randomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function initBoard() {
            board = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                let cCount = (r % 2 === 0) ? cols : cols - 1;
                for (let c = 0; c < cCount; c++) {
                    // 처음에는 위쪽 4줄만 채워둠
                    let color = (r < 4) ? randomColor() : null;
                    row.push({ color: color });
                }
                board.push(row);
            }
        }

        initBoard();

        // 마우스 움직임으로 발사 각도 조절
        let mouseX = canvas.width / 2;
        let mouseY = 0;
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // 마우스 클릭 시 방울 발사
        canvas.addEventListener("click", () => {
            if (isMoving) return;

            let angle = Math.atan2(mouseY - shooter.y, mouseX - shooter.x);
            // 너무 수평으로 발사되는 것 방지
            if (angle > -0.1) angle = -0.1;
            if (angle < -Math.PI + 0.1) angle = -Math.PI + 0.1;

            let speed = 10;
            bullet = {
                x: shooter.x,
                y: shooter.y,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                color: shooter.color
            };
            isMoving = true;
        });

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (isMoving && bullet) {
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;

                // 좌우 벽 충돌 반사
                if (bullet.x - bubbleRadius < 0 || bullet.x + bubbleRadius > canvas.width) {
                    bullet.dx = -bullet.dx;
                }

                // 천장에 닿았을 때 또는 다른 방울과 부딪혔을 때
                if (bullet.y - bubbleRadius <= 0 || checkCollisionWithBoard()) {
                    snapBulletToBoard();
                }
            }
        }

        function checkCollisionWithBoard() {
            for (let r = 0; r < board.length; r++) {
                let cCount = (r % 2 === 0) ? cols : cols - 1;
                let rowOffsetX = (r % 2 === 0) ? 0 : bubbleRadius;

                for (let c = 0; c < cCount; c++) {
                    if (board[r][c].color !== null) {
                        let bx = c * (bubbleRadius * 2) + bubbleRadius + rowOffsetX;
                        let by = r * (bubbleRadius * 1.7) + bubbleRadius;

                        let dist = Math.hypot(bullet.x - bx, bullet.y - by);
                        if (dist < bubbleRadius * 1.8) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function snapBulletToBoard() {
            // 가장 가까운 빈 격자 칸 찾기 또는 맨 위에 붙이기
            let bestR = 0, bestC = 0;
            let minDist = Infinity;

            for (let r = 0; r < board.length; r++) {
                let cCount = (r % 2 === 0) ? cols : cols - 1;
                let rowOffsetX = (r % 2 === 0) ? 0 : bubbleRadius;

                for (let c = 0; c < cCount; c++) {
                    if (board[r][c].color === null) {
                        let bx = c * (bubbleRadius * 2) + bubbleRadius + rowOffsetX;
                        let by = r * (bubbleRadius * 1.7) + bubbleRadius;

                        let dist = Math.hypot(bullet.x - bx, bullet.y - by);
                        if (dist < minDist) {
                            minDist = dist;
                            bestR = r;
                            bestC = c;
                        }
                    }
                }
            }

            board[bestR][bestC].color = bullet.color;
            
            // 같은 색 연쇄 터뜨리기 확인
            let matched = findMatches(bestR, bestC, bullet.color, []);
            if (matched.length >= 3) {
                matched.forEach(pos => {
                    board[pos.r][pos.c].color = null;
                });
                score += matched.length * 100;
                document.getElementById("score").innerText = score;
                dropFloatingBubbles();
            }

            // 발사체 초기화 및 다음 색상 준비
            bullet = null;
            isMoving = false;
            shooter.color = randomColor();
        }

        function findMatches(r, c, color, visited) {
            let key = `${r},${c}`;
            if (visited.some(v => v.r === r && v.c === c)) return [];
            if (r < 0 || r >= board.length || c < 0 || c >= board[r].length) return [];
            if (board[r][c].color !== color) return [];

            visited.push({ r, c });

            // 인접한 육각형 격자 방향들
            let neighbors = getNeighbors(r, c);
            for (let n of neighbors) {
                findMatches(n.r, n.c, color, visited);
            }

            return visited;
        }

        function getNeighbors(r, c) {
            let isEven = (r % 2 === 0);
            let offsets = isEven ? [
                {r: -1, c: -1}, {r: -1, c: 0},
                {r: 0, c: -1},  {r: 0, c: 1},
                {r: 1, c: -1},  {r: 1, c: 0}
            ] : [
                {r: -1, c: 0},  {r: -1, c: 1},
                {r: 0, c: -1},  {r: 0, c: 1},
                {r: 1, c: 0},   {r: 1, c: 1}
            ];

            let results = [];
            for (let off of offsets) {
                let nr = r + off.r;
                let nc = c + off.c;
                if (nr >= 0 && nr < board.length && nc >= 0 && nc < board[nr].length) {
                    results.push({r: nr, c: nc});
                }
            }
            return results;
        }

        function dropFloatingBubbles() {
            // 천장에 연결되지 않은 떠있는 방울들 제거 로직 (생략하거나 간단하게 구현)
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 격자 방울들 그리기
            for (let r = 0; r < board.length; r++) {
                let cCount = (r % 2 === 0) ? cols : cols - 1;
                let rowOffsetX = (r % 2 === 0) ? 0 : bubbleRadius;

                for (let c = 0; c < cCount; c++) {
                    if (board[r][c].color !== null) {
                        let bx = c * (bubbleRadius * 2) + bubbleRadius + rowOffsetX;
                        let by = r * (bubbleRadius * 1.7) + bubbleRadius;

                        drawBubble(bx, by, board[r][c].color);
                    }
                }
            }

            // 발사 중인 방울 그리기
            if (bullet) {
                drawBubble(bullet.x, bullet.y, bullet.color);
            }

            // 하단 발사대 대기 방울 그리기
            drawBubble(shooter.x, shooter.y, shooter.color);
            
            // 조준선 가이드
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(shooter.x, shooter.y);
            let angle = Math.atan2(mouseY - shooter.y, mouseX - shooter.x);
            ctx.lineTo(shooter.x + Math.cos(angle) * 60, shooter.y + Math.sin(angle) * 60);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawBubble(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 1, 0, Math.PI * 2);
            ctx.fill();

            // 입체감을 위한 하이라이트 효과
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.beginPath();
            ctx.arc(x - 5, y - 5, bubbleRadius / 3, 0, Math.PI * 2);
            ctx.fill();
        }

        gameLoop();
    </script>
</body>
</html>
