<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>반달 별빛 모으기 게임</title>
    <style>
        body {
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        h1 {
            color: #f1c40f;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #34495e;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
        }
        .instructions {
            margin-top: 12px;
            font-size: 14px;
            color: #bdc3c7;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>🌙 반달 별빛 모으기</h1>
    <div id="score-board">별빛 점수: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="450" height="450"></canvas>
    
    <div class="instructions">
        방향키(←, →, ↑, ↓)를 눌러서 귀여운 **반달**을 조종하세요!<br>
        반짝이는 별을 모으고, 파란색 운석을 피하면 됩니다.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 반달 플레이어 설정
        let moon = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 22,
            speed: 5
        };

        // 별(아이템) 설정
        let star = {
            x: Math.random() * (canvas.width - 40) + 20,
            y: Math.random() * (canvas.height - 40) + 20,
            radius: 12
        };

        // 운석(장애물) 설정
        let meteor = {
            x: Math.random() * canvas.width,
            y: -30,
            radius: 15,
            speed: 3
        };

        let score = 0;
        let keys = {};
        let isGameOver = false;

        // 키보드 입력 감지
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault(); // 스크롤 방지
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function update() {
            if (isGameOver) return;

            // 플레이어 이동
            if (keys["ArrowLeft"] && moon.x - moon.radius > 0) {
                moon.x -= moon.speed;
            }
            if (keys["ArrowRight"] && moon.x + moon.radius < canvas.width) {
                moon.x += moon.speed;
            }
            if (keys["ArrowUp"] && moon.y - moon.radius > 0) {
                moon.y -= moon.speed;
            }
            if (keys["ArrowDown"] && moon.y + moon.radius < canvas.height) {
                moon.y += moon.speed;
            }

            // 운석 이동
            meteor.y += meteor.speed;
            if (meteor.y > canvas.height + 30) {
                meteor.y = -30;
                meteor.x = Math.random() * canvas.width;
                meteor.speed = 2 + Math.random() * 3; // 난이도 조절
            }

            // 별 충돌 체크 (먹기)
            let distToStar = Math.hypot(moon.x - star.x, moon.y - star.y);
            if (distToStar < moon.radius + star.radius) {
                score += 10;
                document.getElementById("score").innerText = score;
                // 별 위치 재생성
                star.x = Math.random() * (canvas.width - 50) + 25;
                star.y = Math.random() * (canvas.height - 50) + 25;
            }

            // 운석 충돌 체크 (게임 오버)
            let distToMeteor = Math.hypot(moon.x - meteor.x, moon.y - meteor.y);
            if (distToMeteor < moon.radius + meteor.radius - 5) {
                isGameOver = true;
            }
        }

        function drawCrescentMoon(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);
            
            // 노란빛 반달 모양 그리기
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.arc(0, 0, radius, -Math.PI / 2, Math.PI / 2, false);
            // 안쪽을 파내어 초승달/반달 모양 만들기
            ctx.arc(radius / 2.5, 0, radius * 0.85, Math.PI / 2, -Math.PI / 2, true);
            ctx.closePath();
            ctx.fill();

            // 귀여운 눈 추가
            ctx.fillStyle = "#2c3e50";
            ctx.beginPath();
            ctx.arc(-radius / 3, -radius / 4, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawStar(x, y, radius) {
            ctx.fillStyle = "#ffeb3b";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ffeb3b";
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * radius + x,
                           -Math.sin((18 + i * 72) * Math.PI / 180) * radius + y);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (radius / 2) + x,
                           -Math.sin((54 + i * 72) * Math.PI / 180) * (radius / 2) + y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0; // 그림자 초기화
        }

        function drawMeteor(x, y, radius) {
            ctx.fillStyle = "#e74c3c";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#e74c3c";
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 별 반짝임 효과 느낌의 배경 점들
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            ctx.fillRect(50, 50, 2, 2);
            ctx.fillRect(150, 250, 3, 3);
            ctx.fillRect(350, 100, 2, 2);
            ctx.fillRect(280, 380, 3, 3);

            // 게임 오브젝트들 그리기
            drawStar(star.x, star.y, star.radius);
            drawMeteor(meteor.x, meteor.y, meteor.radius);
            drawCrescentMoon(moon.x, moon.y, moon.radius);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText("게임 오버! 😢", canvas.width / 2, canvas.height / 2 - 15);
                
                ctx.font = "16px Arial";
                ctx.fillStyle = "#f1c40f";
                ctx.fillText(`최종 점수: ${score}점`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#bdc3c7";
                ctx.font = "13px Arial";
                ctx.fillText("새로고침(F5)을 하면 다시 시작할 수 있어요!", canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
