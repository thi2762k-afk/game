<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>추억의 벽돌 깨기 게임</title>
    <style>
        body {
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        h1 {
            color: #e94560;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        #score-board {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #16213e;
            background-color: #0f3460;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border-radius: 8px;
        }
        .instructions {
            margin-top: 12px;
            font-size: 14px;
            color: #b2bec3;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>🧱 벽돌 깨기 게임</h1>
    <div id="score-board">점수: <span id="score">0</span> | 목숨: <span id="lives">3</span></div>
    
    <canvas id="gameCanvas" width="480" height="400"></canvas>
    
    <div class="instructions">
        마우스 움직임 또는 **좌우 방향키(←, →)**로 패를 조종하세요!<br>
        공이 바닥으로 떨어지지 않게 막으며 모든 벽돌을 깨부수세요.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 공 설정
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;
        const ballRadius = 8;

        // 패(받침대) 설정
        const paddleHeight = 12;
        const paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;

        // 키보드 조작 상태
        let rightPressed = false;
        let leftPressed = false;

        // 벽돌 설정
        const brickRowCount = 4;
        const brickColumnCount = 7;
        const brickWidth = 60;
        const brickHeight = 20;
        const brickPadding = 8;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 18;

        let bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isGameWon = false;

        // 이벤트 리스너 등록
        document.addEventListener("keydown", keyDownHandler);
        document.addEventListener("keyup", keyUpHandler);
        document.addEventListener("mousemove", mouseMoveHandler);

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        function mouseMoveHandler(e) {
            const rect = canvas.getBoundingClientRect();
            let relativeX = e.clientX - rect.left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        // 벽돌과 공 충돌 감지
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += 10;
                            document.getElementById("score").innerText = score;

                            // 전부 깨면 승리
                            if (score === brickRowCount * brickColumnCount * 10) {
                                isGameWon = true;
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#e94560";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
            ctx.fillStyle = "#00adb5";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4"];
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = colors[r];
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isGameOver || isGameWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px Arial";
                ctx.textAlign = "center";
                
                if (isGameWon) {
                    ctx.fillText("축하합니다! 모두 깨부셨어요! 🎉", canvas.width / 2, canvas.height / 2 - 10);
                } else {
                    ctx.fillText("게임 오버 😢", canvas.width / 2, canvas.height / 2 - 10);
                }

                ctx.font = "14px Arial";
                ctx.fillStyle = "#b2bec3";
                ctx.fillText("새로고침(F5)을 누르면 다시 시작할 수 있어요!", canvas.width / 2, canvas.height / 2 + 25);
                return;
            }

            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // 좌우 벽 충돌
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }

            // 천장 충돌
            if (y + dy < ballRadius) {
                dy = -dy;
            } else if (y + dy > canvas.height - ballRadius - 10) {
                // 패들과 충돌 체크
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                } else {
                    // 바닥에 떨어졌을 때 목숨 차감
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    if (!lives) {
                        isGameOver = true;
                    } else {
                        // 공과 패 위치 초기화
                        x = canvas.width / 2;
                        y = canvas.height - 30;
                        dx = 3;
                        dy = -3;
                        paddleX = (canvas.width - paddleWidth) / 2;
                    }
                }
            }

            // 공 이동
            x += dx;
            y += dy;

            // 패들 키보드 이동 처리
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 6;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 6;
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
