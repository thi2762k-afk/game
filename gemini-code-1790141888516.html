<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>클래식 지뢰찾기 게임</title>
    <style>
        body {
            background-color: #c0c0c0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-wrapper {
            background-color: #c0c0c0;
            border-top: 3px solid #ffffff;
            border-left: 3px solid #ffffff;
            border-right: 3px solid #808080;
            border-bottom: 3px solid #808080;
            padding: 10px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
        }
        .header-panel {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background-color: #c0c0c0;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .screen-box {
            background-color: #000000;
            color: #ff0000;
            font-size: 24px;
            font-weight: bold;
            padding: 2px 6px;
            letter-spacing: 2px;
            border: 1px inset #808080;
        }
        .face-btn {
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .face-btn:active {
            border: 2px inset #808080;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(10, 30px);
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .cell.revealed {
            border: 1px solid #7b7b7b;
            background-color: #c0c0c0;
            border-top: none;
            border-left: none;
        }
        .cell.mine {
            background-color: #ff3333;
        }
        /* 숫자에 따른 색상 부여 */
        .c-1 { color: #0000ff; }
        .c-2 { color: #007b00; }
        .c-3 { color: #ff0000; }
        .c-4 { color: #000080; }
        .c-5 { color: #800000; }
        .c-6 { color: #008080; }
        .c-7 { color: #000000; }
        .c-8 { color: #808080; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header-panel">
            <div id="mine-count" class="screen-box">010</div>
            <div class="face-btn" id="reset-btn" onclick="initGame()">😊</div>
            <div id="timer" class="screen-box">000</div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const width = 10;
        const height = 10;
        const mineCount = 10;
        let board = [];
        let isGameOver = false;
        let isFirstClick = true;
        let flags = 0;
        let timer = 0;
        let timerInterval = null;
        let revealedCount = 0;

        const gridElement = document.getElementById("grid");
        const mineCountElement = document.getElementById("mine-count");
        const timerElement = document.getElementById("timer");
        const resetBtn = document.getElementById("reset-btn");

        initGame();

        function initGame() {
            gridElement.innerHTML = "";
            board = [];
            isGameOver = false;
            isFirstClick = true;
            flags = 0;
            revealedCount = 0;
            timer = 0;
            clearInterval(timerInterval);
            timerElement.innerText = "000";
            mineCountElement.innerText = String(mineCount).padStart(3, '0');
            resetBtn.innerText = "😊";

            // 보드판 생성
            for (let r = 0; r < height; r++) {
                let row = [];
                for (let c = 0; c < width; c++) {
                    const cellEl = document.createElement("div");
                    cellEl.classList.add("cell");
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;
                    
                    cellEl.addEventListener("click", () => handleLeftClick(r, c));
                    cellEl.addEventListener("contextmenu", (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    gridElement.appendChild(cellEl);

                    row.push({
                        row: r,
                        col: c,
                        mine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0,
                        element: cellEl
                    });
                }
                board.push(row);
            }
        }

        function placeMines(initialR, initialC) {
            let placed = 0;
            while (placed < mineCount) {
                let r = Math.floor(Math.random() * height);
                let c = Math.floor(Math.random() * width);

                // 첫 클릭 위치와 주변에는 지뢰가 안 생기게 안전지대 설정
                if (Math.abs(r - initialR) <= 1 && Math.abs(c - initialC) <= 1) continue;

                if (!board[r][c].mine) {
                    board[r][c].mine = true;
                    placed++;
                }
            }

            // 주변 지뢰 개수 계산
            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr;
                                let nc = c + dc;
                                if (nr >= 0 && nr < height && nc >= 0 && nc < width && board[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function handleLeftClick(r, c) {
            if (isGameOver || board[r][c].revealed || board[r][c].flagged) return;

            if (isFirstClick) {
                isFirstClick = false;
                placeMines(r, c);
                timerInterval = setInterval(() => {
                    if (timer < 999) timer++;
                    timerElement.innerText = String(timer).padStart(3, '0');
                }, 1000);
            }

            if (board[r][c].mine) {
                // 지뢰를 밟음 -> 게임 오버
                gameOver(false);
                return;
            }

            revealCell(r, c);
            checkWin();
        }

        function revealCell(r, c) {
            if (r < 0 || r >= height || c < 0 || c >= width) return;
            let cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;
            revealedCount++;
            cell.element.classList.add("revealed");

            if (cell.neighborMines > 0) {
                cell.element.innerText = cell.neighborMines;
                cell.element.classList.add(`c-${cell.neighborMines}`);
            } else {
                // 빈 칸일 경우 주변 칸도 연쇄적으로 열기
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(r + dr, c + dc);
                    }
                }
            }
        }

        function handleRightClick(r, c) {
            if (isGameOver || board[r][c].revealed) return;

            let cell = board[r][c];
            if (!cell.flagged) {
                if (flags >= mineCount) return;
                cell.flagged = true;
                cell.element.innerText = "🚩";
                flags++;
            } else {
                cell.flagged = false;
                cell.element.innerText = "";
                flags--;
            }
            mineCountElement.innerText = String(mineCount - flags).padStart(3, '0');
        }

        function gameOver(isWin) {
            isGameOver = true;
            clearInterval(timerInterval);
            resetBtn.innerText = isWin ? "😎" : "😵";

            // 모든 지뢰 공개
            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    if (board[r][c].mine) {
                        board[r][c].element.classList.add("revealed", "mine");
                        board[r][c].element.innerText = "💣";
                    }
                }
            }
        }

        function checkWin() {
            if (revealedCount === (width * height - mineCount)) {
                isGameOver = true;
                clearInterval(timerInterval);
                resetBtn.innerText = "😎";
                alert("축하합니다! 지뢰를 모두 찾았습니다! 🎉");
            }
        }
    </script>
</body>
</html>
